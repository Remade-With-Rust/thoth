[package]
name = "thoth"
version = "0.3.0"
authors = ["Remade With Rust / Mata Network"]
description = "Unicode glyphs, design tokens, chrome a11y helpers, and Oniguruma remade in Rust (Remade With Rust)"
repository = "https://github.com/Remade-With-Rust/thoth"
documentation = "https://docs.rs/thoth"
license = "MIT"
keywords = ["unicode", "glyphs", "symbols", "tokens", "a11y", "regex"]
categories = ["gui", "encoding", "no-std", "text-processing"]
readme = "README.md"
edition = "2021"
rust-version = "1.73"
exclude = ["docs/plans/*", "tools/*"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# ON by default: apps that only take thoth get rusty_alloc. Libraries and
# portfolios that already install an allocator (e.g. mata-alloc) must set
# `default-features = false`.
default = ["rusty-alloc"]
# Pure-Rust global allocator (mimalloc-class). Opt out with default-features = false.
rusty-alloc = ["dep:rusty_alloc-api"]
# Guard pages + encrypted free lists (~4-7% instructions, measured upstream).
secure = ["rusty-alloc", "rusty_alloc-api/secure"]
# Accessible HTML helpers (rusty_a11y). Preferred path for new code.
a11y = []
# v0.1 compat: enables a11y and re-exports symbols::html::labelled.
html = ["a11y"]
# CSS :root sheet emitter for design tokens (rusty_tokens).
css = []
# Oniguruma remake (rusty_expressions). Requires alloc; does not enable rusty-alloc.
expressions = []
# Optional Oniguruma-shaped C ABI (`onig_new` / `regex_t`). Pure Rust, no libonig.
compat = ["expressions"]
# Deterministic VM work counters (tools/onig-bench --count). Not for shipping.
expr-count = ["expressions"]

[dependencies]
# Optional so `default-features = false` removes it from the graph entirely.
# Pin exactly: rusty_alloc is 0.x and earlier releases had UAFs on all targets.
rusty_alloc-api = { version = "=0.4.0", optional = true }

[dev-dependencies]

[[example]]
name = "platform_demo"
required-features = ["a11y", "css"]

[[example]]
name = "expressions_demo"
required-features = ["expressions"]
