[package]
name = "thoth"
version = "0.1.0"
authors = ["Remade With Rust / Mata Network"]
description = "Shared Unicode glyph constants for House Rust apps — ASCII-safe, semantically grouped (Remade With Rust)"
repository = "https://github.com/Ttimmahlax/thoth"
documentation = "https://docs.rs/thoth"
license = "MIT"
keywords = ["unicode", "glyphs", "symbols", "dioxus", "ui"]
categories = ["gui", "encoding", "no-std"]
readme = "README.md"
edition = "2021"
rust-version = "1.73"
exclude = ["docs/plans/*"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# Accessible HTML labelled spans for Dioxus / WebView UIs.
html = []

[dependencies]

[dev-dependencies]
