[package]
name = "thoth"
version = "0.2.0"
authors = ["Remade With Rust / Mata Network"]
description = "Unicode glyphs, design tokens, and chrome a11y helpers — ASCII-safe, semantically grouped (Remade With Rust)"
repository = "https://github.com/Remade-With-Rust/thoth"
documentation = "https://docs.rs/thoth"
license = "MIT"
keywords = ["unicode", "glyphs", "symbols", "tokens", "a11y"]
categories = ["gui", "encoding", "no-std"]
readme = "README.md"
edition = "2021"
rust-version = "1.73"
exclude = ["docs/plans/*"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# Accessible HTML helpers (rusty_a11y). Preferred path for new code.
a11y = []
# v0.1 compat: enables a11y and re-exports symbols::html::labelled.
html = ["a11y"]
# CSS :root sheet emitter for design tokens (rusty_tokens).
css = []

[dependencies]

[dev-dependencies]
