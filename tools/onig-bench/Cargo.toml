[package]
name = "onig-bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Dev-only rusty_expressions vs Oniguruma harness. Not a thoth dependency."

[features]
default = ["rusty-alloc"]
# Links crates.io `onig` (libonig via onig_sys). Needs a C toolchain. Never
# enable this on the shipping thoth crate.
oracle = ["dep:onig"]
# Deterministic VM work counters.
count = ["thoth/expr-count"]
# Install rusty_alloc as the global allocator, as a deliverable would.
# Only affects our arm: libonig allocates through the C runtime.
rusty-alloc = ["thoth/rusty-alloc"]

[dependencies]
thoth = { path = "../..", default-features = false, features = ["expressions"] }
onig = { version = "6.4.0", optional = true, default-features = false }
